[package]
name = "openclaw-personal-core"
version = "0.1.0"
edition = "2021"
description = "Dịch vụ backend cục bộ của plugin OpenClaw Personal (Gmail, Messenger, thông báo)"
license = "UNLICENSED"
publish = false

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3.34"
futures-util = "0.3.34"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "process", "sync", "io-util", "fs", "signal", "io-std"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
